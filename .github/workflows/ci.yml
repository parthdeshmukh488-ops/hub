name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secret scan and env check (I6)
        run: pnpm check:secrets && pnpm check:env
      - name: Root scripts
        run: pnpm exec biome check scripts biome.json package.json turbo.json && pnpm exec tsc -p scripts/tsconfig.json
      - name: Workspace
        run: pnpm turbo run lint typecheck test

  rust:
    name: Program (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect program workspace
        id: detect
        run: echo "present=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Keep the toolchain in sync with rust-toolchain.toml (new clippy lints arrive with new Rust).
      - if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      # Cache ~/.cargo and target/ keyed on Cargo.lock: the LiteSVM runtime is slow to build cold.
      - if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.detect.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - if: steps.detect.outputs.present == 'true'
        run: cargo clippy --all-targets -- -D warnings
      - if: steps.detect.outputs.present == 'true'
        run: cargo test
      - if: steps.detect.outputs.present == 'true'
        name: The committed IDL matches the program
        run: cargo run --quiet -p leash --example idl -- --check

  # The invariant tests of 03-security §3, by name, in one job: "these run on every commit".
  # The full suites run in the jobs above too; this one says which tests carry which invariant.
  # The map from each invariant to its tests is in docs/workstreams/status/WS9.md (Task D).
  security:
    name: Security invariants (I1–I6, parity, x402)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: "I6 non-custodial: no key in the repo, no owner key in any service config"
        run: pnpm check:secrets && pnpm check:env
      - name: "I1–I5 on the program: allowance ceiling, allowlist, freeze, tripwire, one event each"
        run: cargo test -p leash --test invariants
      - name: "I2 firewall: substituted accounts are refused; reports never move money"
        run: cargo test -p leash --test substitution --test report
      - name: "I3 off switch: owner or guardian freezes, only the owner unfreezes"
        run: cargo test -p leash --test admin -- freeze global_switch
      - name: "Parity: the program and the TypeScript evaluator agree on every policy vector"
        run: |
          cargo test -p leash --test vectors --test vectors_onchain
          pnpm --filter @leash/sdk exec vitest run test/vectors.test.ts
      - name: "I3–I4 through the SDK: the third strike freezes; a frozen principal stops every agent"
        run: pnpm --filter @leash/sdk exec vitest run test/agent.test.ts -t "the third strike freezes the agent|stops every agent while the principal is frozen"
      - name: "I5 audit: the indexer stores every payment and denial event"
        run: pnpm --filter @leash/indexer exec vitest run test/chain.test.ts -t "ingests the program"
      - name: "x402: the official facilitator settles a Leash payment and rejects a denied one"
        run: pnpm --filter @leash/x402 exec vitest run test/client.test.ts -t "Path 2"
      - name: "I6 in the web app: Solana Actions return unsigned transactions; the program checks signers"
        run: pnpm --filter @leash/web exec vitest run test/actions.test.ts
