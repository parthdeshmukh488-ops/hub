[toolchain]
anchor_version = "1.2.0"

[features]
resolution = true
skip-lint = false

# The placeholder ID until the program keypair exists (.keys/leash-program.json, never
# committed). `anchor keys sync` then rewrites these lines and `declare_id!` in lib.rs.
[programs.localnet]
leash = "5ZDkdhcRtUrWLpK4vMx3C3r1w8iZyVaXvXzC5kvtQpM5"

[programs.devnet]
leash = "5ZDkdhcRtUrWLpK4vMx3C3r1w8iZyVaXvXzC5kvtQpM5"

[provider]
cluster = "localnet"
# The deployer / upgrade authority lives outside the repository (03-security §5).
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"
