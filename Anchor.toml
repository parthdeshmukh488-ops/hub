[toolchain]
anchor_version = "1.2.0"

[features]
resolution = true
skip-lint = false

# The program keypair lives in .keys/leash-program.json (never committed; Parth keeps a backup).
# `anchor keys sync` checks these lines and `declare_id!` in lib.rs against it.
[programs.localnet]
leash = "HyL9S5mA8ujMMkDcpuY4VcxiwfM974fEhmNjzTgHJncu"

[programs.devnet]
leash = "HyL9S5mA8ujMMkDcpuY4VcxiwfM974fEhmNjzTgHJncu"

[provider]
cluster = "localnet"
# The deployer / upgrade authority lives outside the repository (03-security §5).
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"
