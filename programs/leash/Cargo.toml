[package]
name = "leash"
version = "0.1.0"
description = "Leash: an on-chain spending firewall for AI agents"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "leash"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["event-cpi"] }
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "token_2022"] }

[dev-dependencies]
anchor-lang-idl = { version = "=0.1.4", features = ["build"] }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The LiteSVM suites run the committed artifacts/programs/*.so. LiteSVM 0.17 is the Agave 4.3
# runtime, which loads the SBPF v3 binaries Anchor 1.2 builds (needs rustc >= 1.97.1).
litesvm = "=0.17.0"
solana-account = "4.3.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
