[package]
name = "leash"
version = "0.1.0"
description = "Leash: an on-chain spending firewall for AI agents"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "leash"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["event-cpi"] }
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "token_2022"] }

[dev-dependencies]
anchor-lang-idl = { version = "=0.1.4", features = ["build"] }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
