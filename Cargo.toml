[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
# Anchor 1.2's minimum; the toolchain actually used is pinned in rust-toolchain.toml.
rust-version = "1.89"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
